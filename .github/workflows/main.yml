name: CI

permissions:
  contents: read

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pipenv

      - name: Download UPX [windows-latest]
        if: ${{ matrix.os == 'windows-latest' }}
        run: curl -L -o upx-4.2.1-win64.zip https://github.com/upx/upx/releases/download/v4.2.1/upx-4.2.1-win64.zip

      - name: Extract UPX [windows-latest]
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          7z x upx-4.2.1-win64.zip
          copy upx-4.2.1-win64\upx.exe upx.exe

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pipenv
          python -m pipenv install --dev

      - name: Test
        run: python -m pipenv run pytest

      - name: Build [windows-latest]
        if: ${{ matrix.os == 'windows-latest' }}
        run: python -m pipenv run build_win_installer.bat

      - name: Upload a Build Artifact [windows-latest]
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ matrix.os == 'windows-latest' }}
        with:
          name: shortcircuit.exe
          path: ./dist/shortcircuit.exe

      - name: Build [macos]
        if: ${{ startsWith(matrix.os, 'macos') }}
        run: python -m pipenv run ./build_mac_installer.sh ${{ matrix.arch }}

      - name: Upload a Build Artifact [macos]
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ startsWith(matrix.os, 'macos') }}
        with:
          name: shortcircuit-${{ matrix.arch }}.app.tar.gz
          path: ./dist/shortcircuit.app.tar.gz
