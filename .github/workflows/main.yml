name: CI

permissions:
  contents: read

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
            arch: universal2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pipenv

      - name: Download UPX [windows-latest]
        if: ${{ matrix.os == 'windows-latest' }}
        run: curl -L -o upx-4.2.1-win64.zip https://github.com/upx/upx/releases/download/v4.2.1/upx-4.2.1-win64.zip

      - name: Extract UPX [windows-latest]
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          7z x upx-4.2.1-win64.zip
          copy upx-4.2.1-win64\upx.exe upx.exe

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pipenv
          python -m pipenv install --dev

      - name: Test
        run: python -m pipenv run pytest

      - name: Build [windows-latest]
        if: ${{ matrix.os == 'windows-latest' }}
        run: python -m pipenv run build_win_installer.bat

      - name: Upload a Build Artifact [windows-latest]
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ matrix.os == 'windows-latest' }}
        with:
          name: shortcircuit.exe
          path: ./dist/shortcircuit.exe

      - name: Build [macos]
        if: ${{ startsWith(matrix.os, 'macos') }}
        run: python -m pipenv run ./build_mac_installer.sh ${{ matrix.arch }}

      - name: Upload a Build Artifact [macos]
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ startsWith(matrix.os, 'macos') }}
        with:
          name: shortcircuit-${{ matrix.arch }}.app.tar.gz
          path: ./dist/shortcircuit.app.tar.gz
